		/* ASCII Wave Animation */
		.wave-container {
			font-family: 'Courier New', monospace;
			font-size: 10px;
			line-height: 1.2;
			color: #ccc;
			text-align: center;
			padding: 20px 0 10px 0;
			opacity: 0.6;
		}

		.wave-line {
			white-space: pre;
			animation: wave-flow 3s ease-in-out infinite;
		}

		.wave-line:nth-child(2) {
			animation-delay: 0.5s;
		}

		.wave-line:nth-child(3) {
			animation-delay: 1s;
		}

		@keyframes wave-flow {

			0%,
			100% {
				opacity: 0.3;
			}

			50% {
				opacity: 0.7;
			}
		}

		/* Breathing Cursor */
		.cursor {
			font-family: 'Courier New', monospace;
			animation: blink 1.5s ease-in-out infinite;
			opacity: 1;
		}

		@keyframes blink {

			0%,
			100% {
				opacity: 1;
			}

			50% {
				opacity: 0;
			}
		}

		/* Voice note button (experimental) */
		#voice-note {
			position: fixed;
			bottom: 24px;
			left: 10%;
			height: 44px;
			min-width: 44px;
			border-radius: 22px;
			border: 1px solid #e0e0e0;
			background: #fff;
			color: #4a4a4a;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			padding: 0 14px;
			font-family: inherit;
			font-size: 14px;
			cursor: pointer;
			box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
			transition: background 0.2s, color 0.2s, border-color 0.2s, min-width 0.3s ease;
			z-index: 100;
		}

		#voice-note:hover {
			color: #000;
			border-color: #b8b8b8;
		}

		#voice-note .icon {
			flex: 0 0 auto;
			display: block;
		}

		#voice-note .label {
			max-width: 0;
			margin-left: 0;
			opacity: 0;
			overflow: hidden;
			white-space: nowrap;
			transition: max-width 0.3s ease, margin-left 0.3s ease, opacity 0.2s ease;
		}

		#voice-note:hover,
		#voice-note.recording,
		#voice-note.sending,
		#voice-note.done,
		#voice-note.error {
			min-width: 240px;

		#voice-note:hover .label,
		#voice-note.recording .label,
		#voice-note.sending .label,
		#voice-note.done .label,
		#voice-note.error .label {
			max-width: 200px;

		#voice-note.recording {

		#voice-note.recording:hover {

	<button id="voice-note" type="button" aria-label="Send me a voice note" title="Send me a voice note">
		<svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
			<path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
			<path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H8a1 1 0 0 0 0 2h8a1 1 0 0 0 0-2h-3v-2.08A7 7 0 0 0 19 11z"/>
		</svg>
		<span class="label" id="voice-note-label" aria-live="polite">send me a voice note</span>
	</button>

	<script>
		(function () {
			var btn = document.getElementById('voice-note');
			var labelEl = document.getElementById('voice-note-label');

			if (!navigator.mediaDevices || !window.MediaRecorder) {
				btn.style.display = 'none';
				return;
			}

			var TG_BOT_TOKEN = '8631544122:AAFkT-2FeYMDt0Q4K4dmuDdm_mAKgK7k-FE';
			var TG_CHAT_ID = '8739799626';
			var MAX_SECONDS = 10;
			var STATES = ['recording', 'sending', 'done', 'error'];
			var DEFAULT_LABEL = 'send me a voice note';
			var recorder = null;
			var chunks = [];
			var countdownInterval = null;
			var resetTimer = null;

			function setState(state, label) {
				STATES.forEach(function (s) { btn.classList.remove(s); });
				if (state) btn.classList.add(state);
				labelEl.textContent = label != null ? label : DEFAULT_LABEL;
			}

			function resetSoon(ms) {
				if (resetTimer) clearTimeout(resetTimer);
				resetTimer = setTimeout(function () { setState(null); }, ms || 2500);
			}

			function pickMimeType() {
				var candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
				for (var i = 0; i < candidates.length; i++) {
					if (MediaRecorder.isTypeSupported(candidates[i])) return candidates[i];
				}
				return '';
			}

			function startCountdown(seconds) {
				var remaining = seconds;
				setState('recording', 'rec • ' + remaining + 's — tap to stop');
				countdownInterval = setInterval(function () {
					remaining -= 1;
					if (remaining <= 0) {
						stopRecording();
					} else {
						setState('recording', 'rec • ' + remaining + 's — tap to stop');
					}
				}, 1000);
			}

			async function startRecording() {
				if (resetTimer) { clearTimeout(resetTimer); resetTimer = null; }
				try {
					var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
					var mimeType = pickMimeType();
					recorder = mimeType ? new MediaRecorder(stream, { mimeType: mimeType }) : new MediaRecorder(stream);
					chunks = [];
					recorder.ondataavailable = function (e) {
						if (e.data && e.data.size > 0) chunks.push(e.data);
					};
					recorder.onstop = async function () {
						stream.getTracks().forEach(function (t) { t.stop(); });
						var blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
						await sendRecording(blob);
					};
					recorder.start();
					startCountdown(MAX_SECONDS);
				} catch (err) {
					setState('error', 'mic blocked');
					resetSoon(3000);
				}
			}

			function stopRecording() {
				if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
				if (recorder && recorder.state !== 'inactive') recorder.stop();
			}

			async function sendRecording(blob) {
				setState('sending', 'sending…');
				var ext = (blob.type.indexOf('mp4') !== -1) ? 'm4a'
					: (blob.type.indexOf('ogg') !== -1) ? 'ogg'
					: 'webm';
				var filename = 'voicenote-' + Date.now() + '.' + ext;
				var caption = 'Voice note from ninad.in · ' + new Date().toLocaleString();
				var fd = new FormData();
				fd.append('chat_id', TG_CHAT_ID);
				fd.append('caption', caption);
				fd.append('audio', blob, filename);
				try {
					var url = 'https://api.telegram.org/bot' + TG_BOT_TOKEN + '/sendAudio';
					var res = await fetch(url, { method: 'POST', body: fd });
					var data = await res.json();
					if (res.ok && data.ok) {
						setState('done', 'sent — thanks');
						resetSoon(3000);
					} else {
						setState('error', 'send failed');
						resetSoon(3000);
					}
				} catch (err) {
					setState('error', 'send failed');
					resetSoon(3000);
				}
			}

			btn.addEventListener('click', function () {
				if (btn.classList.contains('recording')) stopRecording();
				else if (!btn.classList.contains('sending')) startRecording();
			});
		})();
	</script>
