<!DOCTYPE html>

<html>

<head>
	<meta charset="utf-8">
	<title>Books - Ninad Raval</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://fonts.googleapis.com/css?family=Lora" rel="stylesheet">
	<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">

	<style type="text/css">
		html {
			background:
				radial-gradient(circle, #e0e0e0 1px, transparent 1px),
				url(bg.jpg) no-repeat center center fixed;
			background-size: 15px 15px, cover;
			background-color: #fbfbf5;
			background-position: 0 0, center center;
		}

		html,
		body {
			font-family: 'Lora', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
			margin: 0px;
			width: 100%;
			height: 100%;
			font-size: 12px;
		}

		#page {
			border: 0px;
			max-width: 820px;
			text-align: left;
			padding: 50px 10%;
			line-height: 1.6em;
			font-size: 130%;
			color: #000;
		}

		.footer {
			color: #ccc;
			font-size: 16px;
		}

		a,
		a:visited {
			color: #8e8e8e;
			text-decoration: underline;
			border: none;
		}

		a:hover {
			color: #000;
		}

		span.name {
			font-size: 175%;
			font-weight: 700;
		}

		.intro {
			color: #555;
			margin-bottom: 2em;
		}

		.back {
			display: block;
			margin-bottom: 2em;
			font-size: 90%;
		}

		h2 {
			font-size: 75%;
			font-weight: 700;
			letter-spacing: 0.12em;
			text-transform: uppercase;
			color: #b8b8b8;
			margin-top: 2.6em;
			margin-bottom: 0.6em;
		}

		section:first-of-type h2 {
			margin-top: 1em;
		}

		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
			gap: 28px 22px;
		}

		.book {
			text-decoration: none;
			color: inherit;
			display: block;
		}

		.book:hover .meta {
			color: #000;
		}

		.cover {
			width: 100%;
			aspect-ratio: 2 / 3;
			background: #efece4;
			border: 1px solid #e7e3d6;
			box-shadow: 0 1px 0 #00000010, 0 6px 14px #0000000a;
			object-fit: cover;
			display: block;
		}

		.cover.placeholder {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			padding: 14px;
			text-align: center;
			font-size: 11px;
			line-height: 1.35em;
			color: #6b6b6b;
			background: #f5f1e6;
			box-sizing: border-box;
		}

		.cover.placeholder .ph-title {
			font-weight: 700;
			margin-bottom: 6px;
		}

		.meta {
			margin-top: 10px;
			font-size: 80%;
			line-height: 1.35em;
			color: #555;
		}

		.meta .title {
			color: #000;
			display: block;
		}

		.meta .author {
			color: #8e8e8e;
		}

		.loading,
		.empty {
			color: #8e8e8e;
			font-style: italic;
		}

		/* Breathing Cursor */
		.cursor {
			font-family: 'Courier New', monospace;
			animation: blink 1.5s ease-in-out infinite;
			opacity: 1;
		}

		@keyframes blink {

			0%,
			100% {
				opacity: 1;
			}

			50% {
				opacity: 0;
			}
		}
	</style>
</head>

<body>
	<div id="page">
		<a href="index.html" class="back">← back</a>

		<span class="name">Books</span><span class="cursor">_</span><br><br>
		<div class="intro">Books I've read and kept thinking about.</div>

		<div id="books"><div class="loading">Loading…</div></div>

		<div class="footer">
			<p>Take a deep breath.</p>
			<p class="credit">Covers via <a href="https://openlibrary.org/dev/docs/api/covers" target="_new">Open Library</a>.</p>
		</div>
	</div>

	<script>
		(async function () {
			const container = document.getElementById('books');

			function parse(text) {
				const sections = [];
				let current = null;
				for (let raw of text.split('\n')) {
					const line = raw.trim();
					if (!line) continue;
					if (line.startsWith('##')) {
						current = { name: line.replace(/^#+\s*/, ''), books: [] };
						sections.push(current);
						continue;
					}
					if (line.startsWith('#')) continue;
					const parts = line.split('|').map(s => s.trim());
					if (parts.length < 4) continue;
					const [id, isbn, title, author] = parts;
					if (!current) {
						current = { name: '', books: [] };
						sections.push(current);
					}
					current.books.push({ id, isbn, title, author });
				}
				return sections.filter(s => s.books.length);
			}

			function render(sections) {
				if (!sections.length) {
					container.innerHTML = '<div class="empty">No books yet.</div>';
					return;
				}
				container.innerHTML = '';
				for (const s of sections) {
					const sec = document.createElement('section');
					if (s.name) {
						const h = document.createElement('h2');
						h.textContent = s.name;
						sec.appendChild(h);
					}
					const grid = document.createElement('div');
					grid.className = 'grid';
					for (const b of s.books) grid.appendChild(card(b));
					sec.appendChild(grid);
					container.appendChild(sec);
				}
			}

			function card(b) {
				const a = document.createElement('a');
				a.className = 'book';
				a.href = b.id ? 'https://www.goodreads.com/book/show/' + b.id : '#';
				a.target = '_new';

				const fallback = () => {
					const ph = document.createElement('div');
					ph.className = 'cover placeholder';
					const t = document.createElement('div');
					t.className = 'ph-title';
					t.textContent = b.title;
					const au = document.createElement('div');
					au.textContent = b.author;
					ph.appendChild(t);
					ph.appendChild(au);
					return ph;
				};

				if (b.isbn) {
					const img = document.createElement('img');
					img.className = 'cover';
					img.alt = b.title;
					img.loading = 'lazy';
					img.src = 'https://covers.openlibrary.org/b/isbn/' + b.isbn + '-M.jpg?default=false';
					img.onerror = () => img.replaceWith(fallback());
					img.onload = () => {
						if (img.naturalWidth < 50) img.replaceWith(fallback());
					};
					a.appendChild(img);
				} else {
					a.appendChild(fallback());
				}

				const meta = document.createElement('div');
				meta.className = 'meta';
				const t = document.createElement('span');
				t.className = 'title';
				t.textContent = b.title;
				const au = document.createElement('span');
				au.className = 'author';
				au.textContent = b.author;
				meta.appendChild(t);
				meta.appendChild(au);
				a.appendChild(meta);

				return a;
			}

			try {
				const res = await fetch('books.md', { cache: 'no-cache' });
				if (!res.ok) throw new Error('failed: ' + res.status);
				const text = await res.text();
				render(parse(text));
			} catch (err) {
				container.innerHTML = '<div class="empty">Couldn’t load the book list.</div>';
			}
		})();
	</script>

	<script src="voice-note.js" defer></script>

</body>

</html>
